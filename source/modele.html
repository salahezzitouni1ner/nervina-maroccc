<title>Nervina Boutique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
@@CSS@@
/* administration */
.adm{padding-block:28px 90px}
.adm-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:25;background:var(--bg);padding-block:14px;border-bottom:1px solid var(--line)}
.adm-top h1{font-size:1.6rem}
.adm-top .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.st{font-size:.84rem;color:var(--muted)}.st.dirty{color:var(--sale)}.st.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}
.tab{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 18px;font-size:.88rem;cursor:pointer}
.tab[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.arow{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.arow .th{width:56px;height:56px;border-radius:2px;background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--accent-ink)}
.arow .th img{width:100%;height:100%;object-fit:cover}.arow .th svg{width:60%}
.arow b{font-weight:500;display:block;line-height:1.3}
.arow small{color:var(--muted)}
.arow.off{opacity:.5}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sm{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:.78rem;cursor:pointer}
.sm:hover{border-color:var(--fg)}.sm.danger{color:var(--sale)}
.ed{background:var(--surface);border-radius:14px;padding:22px;margin:10px 0 18px;display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.f2{grid-template-columns:1fr}.arow{grid-template-columns:48px 1fr}.arow .btns{grid-column:1/-1;justify-content:flex-start}}
.chk{display:flex;align-items:center;gap:10px;font-weight:400}
.chk input{width:auto}
.imgs{display:flex;flex-wrap:wrap;gap:10px}
.im1{width:96px;position:relative}
.im1 img{width:96px;height:120px;object-fit:cover;border-radius:48px 48px 6px 6px;background:var(--bg)}
.im1 .btns{justify-content:center;margin-top:6px;gap:4px}
.im1 span.main{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-fg);font-size:.62rem;padding:2px 8px;border-radius:999px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.warn{border:1px solid var(--sale);color:var(--sale);border-radius:10px;padding:12px 14px;font-size:.88rem}
.gal{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.gal button{border:1px solid var(--line);background:var(--surface);padding:0;width:72px;height:72px;border-radius:2px;overflow:hidden;cursor:pointer}
.gal button[aria-current="true"]{border-color:var(--fg)}
.gal img{width:100%;height:100%;object-fit:cover}
.adm-link{display:none}
.adm-link.on{display:inline-flex}
.para p{margin:0 0 14px;color:var(--muted)}
.para p.q{color:var(--fg);font-weight:500;margin:22px 0 4px}
</style>

<div class="ann" id="ann"></div>
<header class="full">
  <div class="hbar">
    <div style="display:flex;gap:8px"><button class="ib burger" id="bg" aria-label="Menu" aria-expanded="false">Menu</button>
    <nav id="nav" aria-label="Navigation"><a href="#accueil" data-r="accueil">Accueil</a><a href="#catalogue" data-r="catalogue">Catalogue</a><a href="#contact" data-r="contact">Contact</a></nav></div>
    <a class="logo" href="#accueil" aria-label="Nervina, accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 27V13a10 10 0 0 1 20 0v14"/><path d="M9 25v-6h12v6M8 21h14" stroke-width="1.4"/></svg>
      <div><b>NERVINA</b><small>MAROC</small></div>
    </a>
    <div class="tools">
      <a class="ib adm-link" id="admb" href="#admin">Administration</a>
      <button class="ib" id="th" aria-label="Changer de thème" title="Thème"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
      <button class="ib" id="cartb" aria-label="Ouvrir le panier"><span class="hide-m">Panier</span><span class="cnt" id="cnt">0</span></button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="wrap" id="foot"></footer>
<a class="btn wa-float" id="waf" href="#" target="_blank" rel="noopener">WhatsApp</a>
<div id="layer" data-lenis-prevent></div>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/SplitText.min.js"></script>
<script src="vendor/DrawSVGPlugin.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script type="application/json" id="seed">@@SEED@@</script>

<script>
let S=JSON.parse(document.getElementById('seed').textContent);
const $=s=>document.querySelector(s),app=$('#app'),layer=$('#layer');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAD=n=>new Intl.NumberFormat('fr-FR').format(n).replace(/ /g,' ')+' dh';
const waNum=()=>{let d=String(S.settings.whatsapp||'').replace(/\D/g,'');if(d.startsWith('0'))d='212'+d.slice(1);return d};
const WAU=(t)=>'https://wa.me/'+waNum()+(t?'?text='+encodeURIComponent(t):'');
const IMGURL=id=>'/_blob/'+id;
const IMGSM=id=>/^images\//.test(id)?id.replace('images/','images/sm/'):IMGURL(id);
document.addEventListener('error',e=>{const t=e.target;if(!t||t.tagName!=='IMG')return;const s=t.getAttribute('src')||'';if(s.includes('images/sm/')){t.src=s.replace('images/sm/','images/');return}if(!t.dataset.fb){const u=(S.shopify||{})[s];if(u){t.dataset.fb=1;t.src=u}}},true);
const svg=(b)=>`<svg viewBox="0 0 100 70" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">${b}</svg>`;
const ICO={
 tables:svg('<ellipse cx="50" cy="26" rx="40" ry="12"/><path d="M10 26v4c0 7 18 12 40 12s40-5 40-12v-4"/><path d="M32 40v18c0 5 8 8 18 8s18-3 18-8V40"/>'),
 tv:svg('<rect x="8" y="18" width="84" height="28" rx="9"/><path d="M50 18v28M22 46v14M78 46v14"/>'),
 entree:svg('<path d="M34 40V24a16 16 0 0 1 32 0v16"/><rect x="10" y="40" width="80" height="10" rx="3"/><path d="M18 50v14M82 50v14"/>'),
 chambres:svg('<rect x="26" y="12" width="48" height="40" rx="12"/><path d="M26 30h48M50 36v4M34 52v12M66 52v12"/>')};
const ico=c=>ICO[c]||ICO.tables;
const colName=id=>(S.collections.find(c=>c.id===id)||{}).name||'';
const prod=id=>S.products.find(p=>p.id===id);
const vis=()=>S.products.filter(p=>!p.hidden);
const hasOld=p=>p.old>p.price;
let cart={};try{cart=JSON.parse(localStorage.getItem('nv-cart')||'{}')||{}}catch(e){}
const saveCart=()=>{try{localStorage.setItem('nv-cart',JSON.stringify(cart))}catch(e){}};
let canEdit=false,artifact=null,assets=null,dirty=false,saving=false,stMsg='';

function ph(p,cls=''){const im=p.imgs&&p.imgs[0];
  return `<div class="ph ${cls}">${hasOld(p)?`<span class="badge">-${Math.round((1-p.price/p.old)*100)}%</span>`:''}${im?`<img src="${IMGSM(im)}" alt="${esc(p.title)}" loading="lazy" decoding="async">`:ico(p.col)}</div>`}
const priceH=p=>`<span class="price">${MAD(p.price)}${hasOld(p)?`<s>${MAD(p.old)}</s>`:''}</span>`;
function card(p){return `<article class="pc"><a class="im" href="#p-${esc(p.id)}" aria-label="${esc(p.title)}">${ph(p)}</a><h3><a href="#p-${esc(p.id)}">${esc(p.title)}</a></h3>${priceH(p)}<button class="btn ghost add" data-add="${esc(p.id)}">Ajouter au panier</button></article>`}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1900)}
function paras(body){return String(body||'').split(/\n\s*\n/).filter(x=>x.trim()).map(b=>{const l=b.split('\n');return l.length>1&&/\?\s*$/.test(l[0])?`<p class="q">${esc(l[0])}</p><p>${esc(l.slice(1).join(' '))}</p>`:`<p>${esc(b)}</p>`}).join('')}

/* ---------- chrome (bandeau, pied, whatsapp) ---------- */
function chrome(){
  const st=S.settings;
  $('#ann').textContent=st.banner||'';$('#ann').hidden=!st.banner;
  $('#waf').href=WAU('Bonjour, je suis intéressé par vos produits 😊');
  const ig=String(st.instagram||'').replace(/^@/,'');
  $('#foot').innerHTML=`<div class="fg">
    <div><h4>Nervina Maroc</h4><p>${esc(st.footerText)}</p></div>
    <div><h4>Boutique</h4><a href="#catalogue">Catalogue</a>${S.collections.map(c=>`<a href="#c-${esc(c.id)}">${esc(c.name)}</a>`).join('')}</div>
    <div><h4>Informations</h4><a href="#contact">Contact</a>${Object.entries(S.pages).map(([k,v])=>`<a href="#${esc(k)}">${esc(v.title)}</a>`).join('')}</div>
    <div><h4>Nous joindre</h4><p>WhatsApp<br><strong style="color:var(--fg);font-weight:500">${esc(st.whatsapp)}</strong></p>${ig?`<p style="margin-top:10px"><a href="https://www.instagram.com/${encodeURIComponent(ig)}/" target="_blank" rel="noopener" style="padding:0">@${esc(ig)}</a></p>`:''}</div>
  </div><div class="copy"><span>${esc(st.legal)}</span>${st.email?`<a href="mailto:${esc(st.email)}" style="color:inherit">${esc(st.email)}</a>`:''}</div>`;
  $('#admb').classList.toggle('on',canEdit);
}

/* ---------- vues boutique ---------- */
let filt='all',q='',sort='def';
/* ---------- défilement doux (Lenis) + bannière animée (GSAP) ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let LEN=null;
(function(){
  if(!window.Lenis||RM.matches)return;
  LEN=new Lenis({autoRaf:!window.gsap,anchors:false,lerp:.1,smoothWheel:true});
  if(window.gsap){if(window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);LEN.on('scroll',ScrollTrigger.update)}gsap.ticker.add(t=>LEN.raf(t*1000));gsap.ticker.lagSmoothing(0)}
})();
const toY=y=>{if(LEN)LEN.scrollTo(y,{immediate:true,force:true});else scrollTo(0,y)};
let MG=null;
function mgKill(){if(MG){try{MG.ctx&&MG.ctx.revert()}catch(e){}MG=null}}
function mgGrain(){
  if(mgGrain.u)return mgGrain.u;
  try{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),d=x.createImageData(160,160);
    for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*70|0}
    x.putImageData(d,0,0);mgGrain.u=c.toDataURL()}catch(e){mgGrain.u=''}
  return mgGrain.u}
function mgSync(){
  if(!MG)return;const on=MG.vis!==false&&!MG.user&&!document.hidden,root=$('#mg');
  MG.L.forEach(t=>on?t.resume():t.pause());
  if(root){root.classList.toggle('mg-paused',!on);const pp=$('#mgpp');if(pp){pp.classList.toggle('is-paused',!!MG.user);pp.setAttribute('aria-label',MG.user?"Lancer l'animation":"Mettre l'animation en pause")}}
}
document.addEventListener('visibilitychange',mgSync);
function mgInit(){
  const root=$('#mg');if(!root)return;
  const g=root.querySelector('.mg-grain');if(g){const u=mgGrain();if(u)g.style.backgroundImage=`url(${u})`}
  const pp=$('#mgpp');
  if(!window.gsap||!window.ScrollTrigger||!window.SplitText||RM.matches){root.classList.add('mg-static');if(pp)pp.hidden=true;return}
  gsap.registerPlugin(ScrollTrigger,SplitText,...(window.DrawSVGPlugin?[DrawSVGPlugin]:[]));
  MG={L:[],vis:true,user:false};
  const st=MG;
  MG.ctx=gsap.context(()=>{
    const q1=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
    const split=SplitText.create(q1('.mg-h1'),{type:'words',wordsClass:'mg-w'});
    const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
    tl.from('.mg-glow',{opacity:0,scale:.5,duration:1.8},0)
      .from('.mg-grain',{opacity:0,duration:1},0)
      .from('.mg-line path',window.DrawSVGPlugin?{drawSVG:'50% 50%',duration:1.4,ease:'power2.inOut'}:{opacity:0,duration:1},.1)
      .from('.mg-win',{clipPath:'inset(100% 0% 0% 0%)',duration:1.3,ease:'power4.inOut'},.45)
      .from('.mg-win img',{scale:1.4,duration:2,ease:'power3.out'},.45)
      .from('.mg-eye',{opacity:0,y:10,duration:.6},.5)
      .from(split.words,{opacity:0,y:24,filter:'blur(12px)',stagger:.07,duration:.95},.65)
      .from('.mg-em',{clipPath:'inset(0% 100% 0% 0%)',duration:1.1,ease:'power4.inOut'},1.05)
      .from('.mg-table',{y:-170,opacity:0,rotation:-7,filter:'blur(10px)',duration:1.15,ease:'power4.out'},1.05)
      .from('.mg-shadow',{scaleX:.15,opacity:0,duration:1.15},1.05)
      .from('.mg-badge',{scale:0,rotation:-140,opacity:0,duration:1,ease:'back.out(1.6)'},1.3)
      .from('.mg-chip',{y:16,scale:.7,opacity:0,stagger:.13,duration:.75,ease:'back.out(2)'},1.45)
      .from('.mg-lead,.mg-cta,.mg-tag',{opacity:0,y:16,stagger:.1,duration:.7},1.35)
      .from('.mg-mq',{opacity:0,y:12,duration:.8},1.6)
      .from('.mg-pp',{opacity:0,duration:.6},1.8);
    const imgs=qa('.mg-win img,.mg-table').map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve());
    Promise.race([Promise.all(imgs),new Promise(r=>setTimeout(r,1400))]).then(()=>tl.play());
    const L=st.L,loop=v=>(L.push(v),v);
    loop(gsap.to('.mg-table',{y:-10,duration:2.7,ease:'sine.inOut',yoyo:true,repeat:-1,delay:2.3}));
    loop(gsap.to('.mg-shadow',{scaleX:.84,opacity:.5,duration:2.7,ease:'sine.inOut',yoyo:true,repeat:-1,delay:2.3}));
    const ring=loop(gsap.to('.mg-ring',{rotation:360,duration:20,ease:'none',repeat:-1,transformOrigin:'50% 50%'}));
    qa('.mg-chip').forEach((c,i)=>loop(gsap.to(c,{y:i%2?8:-8,x:i%2?-5:5,duration:3+i*.7,ease:'sine.inOut',yoyo:true,repeat:-1,delay:2.2})));
    loop(gsap.timeline({repeat:-1,delay:1.7}).fromTo('.mg-rip',{scale:1,opacity:.5},{scale:1.34,opacity:0,duration:3.3,ease:'power1.out',stagger:1.1,transformOrigin:'50% 100%'}));
    loop(gsap.to('.mg-glow',{xPercent:14,yPercent:-10,scale:1.15,duration:7,ease:'sine.inOut',yoyo:true,repeat:-1}));
    loop(gsap.fromTo('.mg-em',{backgroundPosition:'100% 0'},{backgroundPosition:'0% 0',duration:2.4,ease:'power2.inOut',repeat:-1,repeatDelay:3.2,delay:2.6}));
    loop(gsap.to('.mg-track',{xPercent:-50,duration:30,ease:'none',repeat:-1}));
    gsap.timeline({scrollTrigger:{trigger:root,start:'top top',end:'bottom top',scrub:.6}})
      .to('.mg-par',{yPercent:12,scale:1.06,ease:'none'},0)
      .to('.mg-obj',{y:-60,ease:'none'},0)
      .to('.mg-archwrap',{y:36,ease:'none'},0)
      .to('.mg-txt',{y:-28,ease:'none'},0);
    ScrollTrigger.create({trigger:root,start:'top bottom',end:'bottom top',
      onToggle:s=>{st.vis=s.isActive;mgSync()},
      onUpdate:s=>{const v=Math.abs(s.getVelocity());if(v>60&&!st.user)gsap.to(ring,{timeScale:1+Math.min(v/250,7),duration:.15,overwrite:true,onComplete:()=>gsap.to(ring,{timeScale:1,duration:1.4})})}});
  },root);
  if(pp)pp.onclick=()=>{st.user=!st.user;mgSync()};
  mgSync();
}
function perks(){return `<ul>${(S.settings.perks||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
const VIEWS={
accueil(){
  const st=S.settings,f=prod(st.featured)||vis()[0],best=vis().filter(p=>p.star).slice(0,4),L=vis();
  const ar=S.collections.slice(0,3).map((c,i)=>`<div class="arch">${ico(c.id)}</div>`).join('');
  const fp=prod('table-basse-amazonica');
  const mq=['Tables','Meubles TV',"Meubles d'entrée",'Tables de chevet','Sur mesure','Fait main au Maroc'];
  const mqh=mq.map(x=>`<span>${esc(x)}</span><svg viewBox="0 0 24 30"><path d="M3 29V12a9 9 0 0 1 18 0v17"/></svg>`).join('');
  return `<section class="mg" id="mg" aria-label="Nervina Maroc">
  <div class="mg-bg" aria-hidden="true"><div class="mg-glow"></div><div class="mg-grain"></div></div>
  <div class="mg-scene" aria-hidden="true">
    <div class="mg-archwrap">
      <svg class="mg-ripples" viewBox="0 0 200 264" preserveAspectRatio="none"><path class="mg-rip" d="M6 262V102a94 94 0 0 1 188 0v160"/><path class="mg-rip" d="M6 262V102a94 94 0 0 1 188 0v160"/><path class="mg-rip" d="M6 262V102a94 94 0 0 1 188 0v160"/></svg>
      <div class="mg-win"><div class="mg-par"><img src="images/meuble-tv-sur-pieds-noyer-creme-3.webp" alt="" fetchpriority="high" decoding="async"></div></div>
      <svg class="mg-line" viewBox="0 0 200 264" preserveAspectRatio="none"><path d="M6 262V102a94 94 0 0 1 188 0v160"/></svg>
      <div class="mg-badge"><svg class="mg-ring" viewBox="0 0 100 100"><defs><path id="mgc" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs><text><textPath href="#mgc" textLength="236">FAIT MAIN AU MAROC · SUR MESURE ·</textPath></text></svg><svg class="mg-bi" viewBox="0 0 24 30"><path d="M3 29V12a9 9 0 0 1 18 0v17"/></svg></div>
    </div>
    <div class="mg-obj"><div class="mg-shadow"></div><img class="mg-table" src="images/hero/amazonica.webp" alt="" decoding="async"></div>
    <span class="mg-chip c1"><i style="background:linear-gradient(135deg,#7a4b2c,#4a2b17)"></i>Noyer massif</span>
    <span class="mg-chip c2"><i style="background:linear-gradient(135deg,#efdcc2,#c9a983)"></i>Verre champagne</span>
    <span class="mg-chip c3"><i style="background:#D9B88F"></i>Sur mesure</span>
  </div>
  <div class="mg-txt">
    <p class="eyebrow mg-eye">Mobilier · Décoration · Menuiserie</p>
    <h1 class="mg-h"><span class="mg-h1">${esc(st.heroTitle1)}</span> <em class="mg-em">${esc(st.heroTitle2)}</em></h1>
    <p class="lead mg-lead">${esc(st.heroLead)}</p>
    <div class="mg-cta"><a class="btn mg-b1" href="#catalogue">Voir le catalogue</a><a class="btn mg-b2" href="#contact">Nous contacter</a></div>
    ${fp&&!fp.hidden?`<a class="mg-tag" href="#p-${esc(fp.id)}"><span class="mg-k">En vedette</span><b>${esc(fp.title)}</b><span class="mg-p">${MAD(fp.price)} <svg viewBox="0 0 16 10" aria-hidden="true"><path d="M0 5h14M10 1l4 4-4 4"/></svg></span></a>`:''}
  </div>
  <div class="mg-mq" aria-hidden="true"><div class="mg-track"><div>${mqh}${mqh}</div><div>${mqh}${mqh}</div></div></div>
  <button class="mg-pp" id="mgpp" aria-label="Mettre l'animation en pause"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="ic-pause" d="M6 4h3v12H6zM11 4h3v12h-3z"/><path class="ic-play" d="M6 4l10 6-10 6z"/></svg></button>
</section>`+`
  ${S.collections.length?`<section class="sec"><div class="sechead"><div><p class="eyebrow">Collections</p><h2>Magasiner par collection</h2></div></div>
    <div class="cols">${S.collections.map(c=>{const n=L.filter(p=>p.col===c.id).length;const cp=L.find(p=>p.col===c.id&&p.imgs&&p.imgs[0]);return `<a class="col" href="#c-${esc(c.id)}"><div class="arch" style="position:relative">${cp?`<img src="${IMGSM(cp.imgs[0])}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="lazy">`:ico(c.id)}</div><span>${esc(c.name)}<small>${n} pièce${n>1?'s':''}</small></span></a>`}).join('')}</div></section>`:''}
  ${L.length?'':`<section class="sec"><p class="empty">Les premières pièces arrivent bientôt. Écrivez-nous sur WhatsApp pour un projet sur mesure.</p></section>`}
  ${f?`<section class="sec"><div class="feat"><div>${ph(f,'sq')}</div><div><p class="eyebrow">Notre coup de cœur</p><h2>${esc(f.title)}</h2>${perks()}<p class="price" style="font-size:1.4rem;margin:0 0 22px">${MAD(f.price)}</p><a class="btn" href="#p-${esc(f.id)}">Découvrir</a></div></div></section>`:''}

contact(){const st=S.settings,ig=String(st.instagram||'').replace(/^@/,'');

page(k){const pg=S.pages[k];if(!pg)return VIEWS.accueil();

function route(){
  mgKill();
  let h=(location.hash||'#accueil').slice(1),html;
  if(h==='admin'){if(canEdit){renderAdmin();setNav(h);return}h='accueil'}
  if(h.startsWith('c-')){filt=h.slice(2);h='catalogue'}
  if(h.startsWith('p-'))html=VIEWS.produit(h.slice(2));
  else if(h==='catalogue')html=VIEWS.catalogue();
  else if(S.pages[h])html=VIEWS.page(h);
  else html=(VIEWS[h]||VIEWS.accueil)();
  app.innerHTML=html;toY(0);bind(h);setNav(h);
}
function setNav(h){document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.r===(h.startsWith('p-')?'catalogue':h)));
  $('#nav').classList.remove('open');$('#bg').setAttribute('aria-expanded','false')}
function bind(h){
  if(h==='accueil')mgInit();
  if(h==='catalogue'){
    app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;rerender()});
    $('#q').oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;rerender();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)};
    $('#so').onchange=e=>{sort=e.target.value;rerender()};
  }
  if(h.startsWith('p-')){
    let n=1;const id=h.slice(2);
    $('#m').onclick=()=>{n=Math.max(1,n-1);$('#n').textContent=n};$('#pl').onclick=()=>{n=Math.min(20,n+1);$('#n').textContent=n};
    $('#ad').onclick=()=>{add(id,n);openCart()};
    app.querySelectorAll('[data-gi]').forEach(b=>b.onclick=()=>{const p=prod(id);$('#mi').src=IMGURL(p.imgs[+b.dataset.gi]);app.querySelectorAll('[data-gi]').forEach(x=>x.setAttribute('aria-current',x===b))});
  }
  if(h==='contact'){
    const u=()=>{const t=`Bonjour Nervina, ${$('#cm').value.trim()||'je suis intéressé par vos produits.'}${$('#cn').value.trim()?'\nNom : '+$('#cn').value.trim():''}${$('#ct').value.trim()?'\nTéléphone : '+$('#ct').value.trim():''}`;$('#cw').href=WAU(t)};
    ['cn','ct','cm'].forEach(i=>$('#'+i).oninput=u);u();
  }
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add,1));
}
function rerender(){const k=scrollY;app.innerHTML=VIEWS.catalogue();bind('catalogue');toY(k)}

function add(id,n){cart[id]=Math.min(20,(cart[id]||0)+n);saveCart();updCnt();toast('Ajouté au panier')}
function updCnt(){$('#cnt').textContent=Object.entries(cart).filter(([id])=>prod(id)).reduce((a,[,b])=>a+b,0)}
const total=()=>Object.entries(cart).reduce((s,[id,n])=>s+(prod(id)?.price||0)*n,0);
function openCart(){
  const items=Object.entries(cart).filter(([id])=>prod(id));
  layer.innerHTML=`<div class="veil" id="vl"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Panier"><div class="dh"><h2>Votre panier</h2><button class="ib" id="cx">Fermer</button></div>
  <div class="db">${items.length?items.map(([id,n])=>{const p=prod(id);return `<div class="li">${ph(p)}<div><b>${esc(p.title)}</b><span class="price" style="font-size:.88rem">${MAD(p.price)}</span><div class="qty"><button data-q="${esc(id)}" data-d="-1" aria-label="Moins">−</button><span>${n}</span><button data-q="${esc(id)}" data-d="1" aria-label="Plus">+</button></div></div><button class="rm" data-r="${esc(id)}">Retirer</button></div>`}).join(''):'<p class="empty">Votre panier est vide.</p>'}</div>
  ${items.length?`<div class="df"><div class="tot"><span>Total</span><span>${MAD(total())}</span></div><span class="note">Livraison confirmée par WhatsApp avant toute validation.</span>
  <input id="on" placeholder="Votre nom" autocomplete="name" aria-label="Nom"><div class="row2"><input id="ot" placeholder="Téléphone" inputmode="tel" autocomplete="tel" aria-label="Téléphone"><input id="ov" placeholder="Ville" autocomplete="address-level2" aria-label="Ville"></div><input id="oa" placeholder="Adresse de livraison" autocomplete="street-address" aria-label="Adresse">
  <a class="btn wide" id="ow" href="#" target="_blank" rel="noopener">Commander sur WhatsApp</a></div>`:`<div class="df"><a class="btn wide" href="#catalogue" id="cc">Voir le catalogue</a></div>`}</aside>`;
  const close=()=>{layer.innerHTML='';document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  $('#vl').onclick=close;$('#cx').onclick=close;$('#cx').focus();if($('#cc'))$('#cc').onclick=close;
  layer.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const id=b.dataset.q;cart[id]=(cart[id]||0)+ +b.dataset.d;if(cart[id]<=0)delete cart[id];if(cart[id]>20)cart[id]=20;saveCart();updCnt();openCart()});
  layer.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.r];saveCart();updCnt();openCart()});
  if($('#ow')){const u=()=>{const l=items.map(([id,n])=>`• ${n} × ${prod(id).title} (${MAD(prod(id).price)})`).join('\n');
    const t=`Bonjour Nervina, je souhaite commander :\n${l}\nTotal : ${MAD(total())}\n\nNom : ${$('#on').value.trim()}\nTéléphone : ${$('#ot').value.trim()}\nVille : ${$('#ov').value.trim()}\nAdresse : ${$('#oa').value.trim()}`;
    $('#ow').href=WAU(t)};['on','ot','ov','oa'].forEach(i=>$('#'+i).oninput=u);u()}
}

function bindA(){
  const body=$('#abody');
  body.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,id=b.dataset.id;
    if(a==='edit'){editId=editId===id?null:id;delAsk=null;return refreshBody()}
    if(a==='new'){const nid=uniq('nouveau-produit');S.products.unshift({id:nid,title:'Nouveau produit',price:0,old:0,col:S.collections[0]?.id||'',desc:'',imgs:[],hidden:true,star:false});editId=nid;markDirty();return refreshBody()}
    if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1;[S.products[i],S.products[j]]=[S.products[j],S.products[i]];markDirty();return refreshBody()}
    if(a==='del'){delAsk=editId;return refreshBody()}
    if(a==='delno'){delAsk=null;return refreshBody()}
    if(a==='delyes'){S.products=S.products.filter(p=>p.id!==editId);if(S.settings.featured===editId)S.settings.featured=S.products[0]?.id||'';editId=null;delAsk=null;markDirty();return refreshBody()}
    const p=prod(editId);
    if(p&&(a==='imgl'||a==='imgr')){const j=a==='imgl'?i-1:i+1;[p.imgs[i],p.imgs[j]]=[p.imgs[j],p.imgs[i]];markDirty();return refreshBody()}
    if(p&&a==='imgx'){p.imgs.splice(i,1);markDirty();return refreshBody()}
    if(a==='colnew'){let n=uniq('collection',S.collections);S.collections.push({id:n,name:'Nouvelle collection'});markDirty();return refreshBody()}
    if(a==='colx'){S.collections.splice(i,1);markDirty();return refreshBody()}
  };
  body.oninput=e=>{const t=e.target;
    const w=t.closest('[data-pid]');
    if(w&&t.dataset.k){const p=prod(w.dataset.pid);const k=t.dataset.k;
      if(t.type==='checkbox')p[k]=t.checked;else if(t.dataset.n)p[k]=Math.max(0,parseInt(String(t.value).replace(/\D/g,''),10)||0);else p[k]=t.value;
      markDirty();return}
    if(t.dataset.ck!==undefined){S.collections[+t.dataset.ck].name=t.value;markDirty();return}
    if(t.dataset.s){S.settings[t.dataset.s]=t.value;markDirty();return}
    if(t.dataset.perk!==undefined){(S.settings.perks=S.settings.perks||[])[+t.dataset.perk]=t.value;markDirty();return}
    if(t.dataset.tt!==undefined){const a=(S.settings.trust=S.settings.trust||[]);(a[+t.dataset.tt]=a[+t.dataset.tt]||{t:'',d:''}).t=t.value;markDirty();return}
    if(t.dataset.td!==undefined){const a=(S.settings.trust=S.settings.trust||[]);(a[+t.dataset.td]=a[+t.dataset.td]||{t:'',d:''}).d=t.value;markDirty();return}
    if(t.dataset.pt){S.pages[pageKey].title=t.value;markDirty();return}
    if(t.dataset.pb){S.pages[pageKey].body=t.value;markDirty();return}
  };
  body.onchange=async e=>{const t=e.target;
    if(t.id==='pk'){pageKey=t.value;return refreshBody()}
    if(t.dataset.k==='col'||t.dataset.k==='hidden'||t.dataset.k==='star'){if(t.dataset.k!=='col')return;}
    if(t.id==='fi'&&t.files.length){await upload(t)}
    if(t.dataset.s==='featured'){}
  };
}
function refreshBody(){const y=scrollY;$('#abody').innerHTML=aBody();paintSt();toY(y);bindA()}
function uniq(base,list=S.products){let id=slug(base),n=1;const has=x=>list.some(p=>p.id===x);while(has(id)){n++;id=slug(base)+'-'+n}return id}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
    const M=1600,r=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.86));
  }finally{URL.revokeObjectURL(url)}
}
async function upload(inp){
  const p=prod(editId),files=[...inp.files],u=$('#up');let ok=0;
  for(const f of files){
    if(u)u.textContent=`Envoi ${ok+1}/${files.length}…`;
    try{const blob=await shrink(f);const r=await assets.upload(blob,{type:'image/jpeg'});p.imgs=p.imgs||[];p.imgs.push(r.id);ok++;markDirty()}
    catch(e){if(u)u.textContent='Échec de l\'envoi'+(e&&e.code?' ('+e.code+')':'')+'.';break}
  }
  refreshBody();
}
async function publish(){
  if(saving||!dirty)return;saving=true;paintSt();
  const json=JSON.stringify(S);
  try{
    if(!artifact)throw {code:'capability_disabled'};
    await artifact.publish({'store.json':json});
    dirty=false;stMsg='Publié. Les visiteurs voient les changements.';
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict')stMsg='Une autre version a été publiée. Rechargez la page puis refaites vos changements.';
    else if(c==='not_writer'||c==='not_granted')stMsg='Vous n\'avez pas le droit de publier.';
    else if(c==='capability_disabled')stMsg='Publication directe indisponible ici.';
    else if(c==='rate_limited')stMsg='Trop de publications, attendez un instant.';
    else stMsg='La publication a échoué. Réessayez.';
    if(c==='capability_disabled'||c==='upstream_error')offerFile(json);
  }
  saving=false;paintSt();
}
async function offerFile(json){
  try{const d=await claude.use('downloads');if(!d)return;
    stMsg+=' Vos données vont être proposées en téléchargement.';paintSt();
    await d.save({filename:'store.json',data:json});
  }catch(e){}
}

(async()=>{
