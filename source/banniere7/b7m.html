<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:#F3F0E6;overflow:hidden}
body{font-family:'Poppins',sans-serif;color:#111213;position:relative}
.tag{display:inline-block;letter-spacing:.2em;text-transform:uppercase;color:#85582F;font-weight:500;border:1.5px solid #B07F52}
h1{font-weight:300;line-height:1.02;letter-spacing:-.035em}
h1 em{font-style:normal;font-weight:500;color:#85582F}
.sub{color:#585C60;line-height:1.35}
.grid{display:grid}
.cell{display:flex;flex-direction:column;min-width:0}
.tile{position:relative;background:#EBE7D8;border:1px solid rgba(176,127,82,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img{display:block;height:auto;max-height:100%;object-fit:contain}
.num{position:absolute;top:0;left:0;font-weight:500;color:#B07F52;letter-spacing:.08em}
.lab{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.lab span{display:block;font-weight:400;color:#111213;line-height:1.15;white-space:nowrap}
.lab small{display:block;letter-spacing:.18em;text-transform:uppercase;color:#85582F;font-weight:500}
.lab i{font-style:normal;color:#B07F52;line-height:1}
.foot{display:flex;justify-content:center;align-items:center;border-top:1.5px solid rgba(17,18,19,.15);color:#585C60}
.foot b{display:inline-block;width:7px;height:7px;background:#B07F52;transform:rotate(45deg);margin:0 .9em;vertical-align:middle}
/* téléphone 1080 x 1350 */
.m{width:1080px;height:1350px;padding:58px 56px 0}
.m .tag{font-size:25px;padding:10px 18px}
.m h1{font-size:86px;margin-top:20px}
.m .sub{display:none}
.m .grid{grid-template-columns:1fr 1fr;gap:22px 26px;margin-top:32px}
.m .tile{height:204px;padding:14px 18px}
.m .num{font-size:20px;padding:14px 16px}
.m .lab{margin-top:11px}.m .lab span{font-size:29px}.m .lab small{font-size:18px;margin-bottom:2px}.m .lab i{font-size:28px}
.m .foot{position:absolute;left:56px;right:56px;bottom:40px;padding-top:24px;font-size:28px}
/* ordinateur 1920 x 820 */
.d{width:1920px;height:820px;padding:0 96px;display:grid;grid-template-columns:660px 1fr;gap:80px;align-items:center}
.d .tag{font-size:19px;padding:10px 18px}
.d h1{font-size:92px;margin-top:28px;white-space:nowrap}
.d .sub{font-size:27px;margin-top:22px}
.d .foot{justify-content:flex-start;border:0;font-size:21px;margin-top:44px;padding-top:26px;border-top:1.5px solid rgba(17,18,19,.15);max-width:560px}
.d .grid{grid-template-columns:repeat(3,1fr);gap:28px 26px}
.d .tile{height:236px;padding:16px 18px}
.d .num{font-size:15px;padding:12px 14px}
.d .lab{margin-top:12px}.d .lab span{font-size:23px}.d .lab small{font-size:14px;margin-bottom:3px}.d .lab i{font-size:22px}
</style></head><body class="m">
<span class="tag">Fait main · Sur mesure</span><h1>Une pièce pour<br><em>chaque pièce.</em></h1><div class="grid"><div class="cell"><div class="tile"><span class="num">01</span><img src="crop-tv.png" style="width:90%"></div><div class="lab"><div><small>Meuble TV</small><span>Noyer & crème</span></div><i>→</i></div></div><div class="cell"><div class="tile"><span class="num">02</span><img src="crop-london.png" style="width:76%"></div><div class="lab"><div><small>Tables basses</small><span>Table London</span></div><i>→</i></div></div><div class="cell"><div class="tile"><span class="num">03</span><img src="crop-console.png" style="width:54%"></div><div class="lab"><div><small>Entrée</small><span>Console Arche</span></div><i>→</i></div></div><div class="cell"><div class="tile"><span class="num">04</span><img src="crop-chevet.png" style="width:43%"></div><div class="lab"><div><small>Chambres</small><span>Chevet Arrondi</span></div><i>→</i></div></div><div class="cell"><div class="tile"><span class="num">05</span><img src="crop-set.png" style="width:60%"></div><div class="lab"><div><small>Tables basses</small><span>Set Organique</span></div><i>→</i></div></div><div class="cell"><div class="tile"><span class="num">06</span><img src="crop-ovale.png" style="width:78%"></div><div class="lab"><div><small>Tables basses</small><span>Table Ovale Marbre</span></div><i>→</i></div></div></div><p class="foot">Fait main au Maroc<b></b>Livraison partout au Maroc</p>
</body></html>
