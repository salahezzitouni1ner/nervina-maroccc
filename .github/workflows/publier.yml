name: Publier la boutique

# Après chaque modification faite depuis /admin/ (store.json), régénère les pages du site.
on:
  push:
    branches: [main]
    paths: ['store.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/publish.py
      - name: Enregistrer les pages générées
        run: |
          git config user.name "nervina-publication"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien à publier"; exit 0; fi
          git commit -m "Publication automatique des pages"
          git pull --rebase origin main
          git push
