<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nervina Maroc : tables, meubles TV, consoles et tables de chevet sur mesure. Livraison partout au Maroc, commande par WhatsApp.">
<title>Nervina Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>

/* Concept : boutique en ligne dont chaque photo est cadrée par l'arche du logo ; fond chaud, accents sable et cuivre. */
:root{
  --bg:#F3F0E6; --surface:#E9E2D2; --card:#FBF9F3; --fg:#1B1D1F; --muted:#585C60; --line:rgba(27,29,31,.15);
  --accent:#B07F52; --accent-ink:#85582F; --btn-bg:#1B1D1F; --btn-fg:#F3F0E6; --sale:#9B3B22; --ok:#2F6B45;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111213; --surface:#1B1E21; --card:#17191B; --fg:#F3F0E6; --muted:#A9A59B; --line:rgba(243,240,230,.15);
  --accent:#D9B88F; --accent-ink:#D9B88F; --btn-bg:#D9B88F; --btn-fg:#111213; --sale:#E58F73; --ok:#7CC49A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111213; --surface:#1B1E21; --card:#17191B; --fg:#F3F0E6; --muted:#A9A59B; --line:rgba(243,240,230,.15);
  --accent:#D9B88F; --accent-ink:#D9B88F; --btn-bg:#D9B88F; --btn-fg:#111213; --sale:#E58F73; --ok:#7CC49A; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit}button{font-family:inherit}
img,svg{display:block;max-width:100%}
.wrap{max-width:1200px;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.full{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}

/* bandeau + en-tête */
.ann{background:var(--btn-bg);color:var(--btn-fg);text-align:center;font-size:.78rem;letter-spacing:.08em;padding:9px 16px;
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:12px;max-width:1200px;margin-inline:auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;justify-self:center}
.logo b{font-weight:500;letter-spacing:.26em;font-size:1rem}
.logo small{display:block;font-size:.58rem;letter-spacing:.3em;color:var(--muted);margin-top:-2px;text-align:center}
nav{display:flex;gap:26px;font-size:.88rem;font-weight:500}
nav a{text-decoration:none;color:var(--muted);padding:6px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current]{color:var(--fg);border-color:var(--accent)}
.tools{display:flex;gap:10px;justify-content:flex-end}
.ib{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;height:42px;min-width:42px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.85rem;font-weight:500}
.ib:hover{border-color:var(--fg)}
.cnt{background:var(--btn-bg);color:var(--btn-fg);border-radius:999px;min-width:20px;height:20px;font-size:.72rem;display:grid;place-items:center;padding:0 6px}
.burger{display:none}
@media(max-width:860px){.hbar{grid-template-columns:auto 1fr auto}nav{display:none}.burger{display:inline-flex}.logo{justify-self:start}
  nav.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px))}
  nav.open a{padding:14px 0;border-bottom:1px solid var(--line)}}
.hide-m{display:inline}
@media(max-width:520px){.hide-m{display:none}.logo b{font-size:.88rem}}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--btn-bg);color:var(--btn-fg);text-decoration:none;
  font-weight:500;font-size:.92rem;padding:13px 26px;border-radius:999px;border:0;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.wide{width:100%}
.eyebrow{font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);font-weight:500;margin:0 0 16px}
h1,h2,h3{font-weight:300;letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,5vw,3.9rem)}h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}

/* accueil */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:52px 64px}
.hero h1 em{font-style:normal;font-weight:500;color:var(--accent-ink)}
.hero p.lead{color:var(--muted);max-width:44ch;margin:22px 0 30px;font-size:1.05rem}
.arches{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end}
.arch{border-radius:999px 999px 10px 10px;background:var(--surface);aspect-ratio:3/5;display:grid;place-items:center;overflow:hidden;color:var(--accent-ink)}
.arch:nth-child(2){aspect-ratio:3/6;background:var(--btn-bg);color:var(--btn-fg)}
.arch svg{width:62%;height:auto}
@media(max-width:860px){.hero{grid-template-columns:1fr;gap:34px;padding-block:32px 44px}}
.sec{padding-block:64px;border-top:1px solid var(--line)}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.col{text-decoration:none;display:block}
.col .arch{aspect-ratio:4/5;background:var(--surface);color:var(--accent-ink);transition:background .25s}
.col:hover .arch{background:var(--btn-bg);color:var(--btn-fg)}
.col span{display:flex;justify-content:space-between;margin-top:12px;font-weight:500}
.col small{color:var(--muted);font-weight:400}
@media(max-width:860px){.cols{grid-template-columns:1fr 1fr}}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.feat .ph{aspect-ratio:4/3}
.feat ul{list-style:none;margin:22px 0 28px;padding:0;border-top:1px solid var(--line)}
.feat li{padding:11px 0;border-bottom:1px solid var(--line)}
@media(max-width:860px){.feat{grid-template-columns:1fr;gap:28px}}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:left}
.trust b{display:block;font-weight:500;margin-bottom:4px}.trust p{margin:0;color:var(--muted);font-size:.93rem}
@media(max-width:700px){.trust{grid-template-columns:1fr}}

/* produits */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 18px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr;gap:24px 12px}}
.pc{position:relative;display:flex;flex-direction:column;min-width:0}
.pc a.im{text-decoration:none;display:block}
.ph{background:var(--surface);color:var(--accent-ink);display:grid;place-items:center;aspect-ratio:4/5;border-radius:999px 999px 8px 8px;overflow:hidden;position:relative}
.ph.sq{border-radius:8px;aspect-ratio:4/3}
.ph svg{width:56%;height:auto}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--sale);color:#fff;font-size:.7rem;font-weight:500;letter-spacing:.06em;padding:3px 10px;border-radius:999px;z-index:2}
.pc h3{font-size:.98rem;font-weight:400;letter-spacing:0;margin:14px 0 4px;line-height:1.35}
.pc h3 a{text-decoration:none}.pc h3 a:hover{text-decoration:underline}
.price{font-weight:500;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:400;margin-left:8px;font-size:.88rem}
.pc .add{margin-top:12px;align-self:flex-start;padding:9px 18px;font-size:.84rem}
.bar2{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 16px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.sf{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{font:400 1rem var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;width:100%}
.sf input,.sf select{width:auto;min-width:0;padding:9px 14px;font-size:.9rem;border-radius:999px}
.empty{color:var(--muted);padding:40px 0}

/* fiche produit */
.crumb{font-size:.82rem;color:var(--muted);padding-block:22px 6px}.crumb a{color:var(--muted)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding-block:20px 72px}
.pd .ph{aspect-ratio:4/5;max-width:520px;width:100%}
.pd h1{font-size:clamp(1.7rem,3.4vw,2.5rem);margin:6px 0 16px}
.pd .price{font-size:1.5rem}.pd .price s{font-size:1.05rem}
.pd p.d{color:var(--muted);margin:18px 0}
.pd ul{list-style:none;margin:0 0 24px;padding:0;border-top:1px solid var(--line)}
.pd li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{background:transparent;border:0;color:var(--fg);width:40px;height:42px;font-size:1.1rem;cursor:pointer}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.buy{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.note{font-size:.82rem;color:var(--muted)}
@media(max-width:860px){.pd{grid-template-columns:1fr;gap:28px}}

/* panier (tiroir) */
.veil{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:71;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);border-left:1px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.3rem}
.db{flex:1;overflow:auto;padding:8px 22px}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.li .ph{aspect-ratio:1;border-radius:32px 32px 6px 6px}.li .ph svg{width:62%}
.li b{font-weight:500;font-size:.9rem;display:block;line-height:1.3}
.li .qty{margin-top:6px}.li .qty button{height:32px;width:32px}
.rm{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline}
.df{padding:18px 22px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--surface)}
.tot{display:flex;justify-content:space-between;font-weight:500;font-size:1.1rem}
.df input{padding:10px 12px;font-size:.92rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* pages infos */
.info{max-width:760px;padding-block:44px 80px}
.info h1{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:22px}
.info p{color:var(--muted)}
.todo{border:1px dashed var(--accent);border-radius:10px;padding:14px 16px;color:var(--accent-ink);font-size:.9rem;margin:20px 0}
details{border-bottom:1px solid var(--line);padding:16px 0}
summary{cursor:pointer;font-weight:500}
details p{margin:10px 0 0}
.cform{display:grid;gap:14px;background:var(--surface);padding:26px;border-radius:14px;margin-top:24px}
label{display:grid;gap:6px;font-size:.82rem;font-weight:500}

footer{border-top:1px solid var(--line);padding-block:44px 36px;margin-top:24px}
.fg{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px}
.fg h4{font-weight:500;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px;color:var(--accent-ink)}
.fg a{display:block;text-decoration:none;color:var(--muted);padding:4px 0;font-size:.92rem}.fg a:hover{color:var(--fg)}
.fg p{color:var(--muted);font-size:.92rem;margin:0}
.copy{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
@media(max-width:860px){.fg{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-fg);padding:12px 22px;border-radius:999px;font-size:.88rem;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.wa-float{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* Habillage sobre : cadres rectangulaires, angles francs */
.ph,.ph.sq,.li .ph,.pd .ph,.feat .ph{border-radius:2px}
.ph{aspect-ratio:1/1}.pd .ph{aspect-ratio:1/1;max-width:none}
.ph img{object-fit:cover}
.badge{left:12px;top:12px;transform:none;border-radius:2px}
.arch,.col .arch{border-radius:2px;aspect-ratio:4/5}
.arch:nth-child(2){aspect-ratio:3/5}
.heroimg{align-self:stretch;min-height:320px;border-radius:2px;overflow:hidden;background:var(--surface);position:relative}
.heroimg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heroimg .arches{height:100%;align-items:stretch}
.btn,.chip,.ib,.sf input,.sf select,.qty,.toast,.cnt{border-radius:2px}
.cnt{border-radius:999px}
input,select,textarea{border-radius:2px}
.cform,.todo{border-radius:2px}
.gal button,.gal img{border-radius:2px}
.col .arch{transition:none}
.col:hover .arch{background:var(--surface);color:var(--accent-ink)}
.col img{transition:transform .4s}.col:hover img{transform:scale(1.03)}
.card .ph img,.card:hover .ph img{transition:transform .4s}.card:hover .ph img{transform:scale(1.04)}

/* administration */
.adm{padding-block:28px 90px}
.adm-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:25;background:var(--bg);padding-block:14px;border-bottom:1px solid var(--line)}
.adm-top h1{font-size:1.6rem}
.adm-top .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.st{font-size:.84rem;color:var(--muted)}.st.dirty{color:var(--sale)}.st.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}
.tab{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 18px;font-size:.88rem;cursor:pointer}
.tab[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.arow{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.arow .th{width:56px;height:56px;border-radius:2px;background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--accent-ink)}
.arow .th img{width:100%;height:100%;object-fit:cover}.arow .th svg{width:60%}
.arow b{font-weight:500;display:block;line-height:1.3}
.arow small{color:var(--muted)}
.arow.off{opacity:.5}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sm{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:.78rem;cursor:pointer}
.sm:hover{border-color:var(--fg)}.sm.danger{color:var(--sale)}
.ed{background:var(--surface);border-radius:14px;padding:22px;margin:10px 0 18px;display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.f2{grid-template-columns:1fr}.arow{grid-template-columns:48px 1fr}.arow .btns{grid-column:1/-1;justify-content:flex-start}}
.chk{display:flex;align-items:center;gap:10px;font-weight:400}
.chk input{width:auto}
.imgs{display:flex;flex-wrap:wrap;gap:10px}
.im1{width:96px;position:relative}
.im1 img{width:96px;height:120px;object-fit:cover;border-radius:48px 48px 6px 6px;background:var(--bg)}
.im1 .btns{justify-content:center;margin-top:6px;gap:4px}
.im1 span.main{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-fg);font-size:.62rem;padding:2px 8px;border-radius:999px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.warn{border:1px solid var(--sale);color:var(--sale);border-radius:10px;padding:12px 14px;font-size:.88rem}
.gal{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.gal button{border:1px solid var(--line);background:var(--surface);padding:0;width:72px;height:72px;border-radius:2px;overflow:hidden;cursor:pointer}
.gal button[aria-current="true"]{border-color:var(--fg)}
.gal img{width:100%;height:100%;object-fit:cover}
.adm-link{display:none}
.adm-link.on{display:inline-flex}
.para p{margin:0 0 14px;color:var(--muted)}
.para p.q{color:var(--fg);font-weight:500;margin:22px 0 4px}
</style>

<div class="ann" id="ann"></div>
<header class="full">
  <div class="hbar">
    <div style="display:flex;gap:8px"><button class="ib burger" id="bg" aria-label="Menu" aria-expanded="false">Menu</button>
    <nav id="nav" aria-label="Navigation"><a href="#accueil" data-r="accueil">Accueil</a><a href="#catalogue" data-r="catalogue">Catalogue</a><a href="#contact" data-r="contact">Contact</a></nav></div>
    <a class="logo" href="#accueil" aria-label="Nervina, accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 27V13a10 10 0 0 1 20 0v14"/><path d="M9 25v-6h12v6M8 21h14" stroke-width="1.4"/></svg>
      <div><b>NERVINA</b><small>MAROC</small></div>
    </a>
    <div class="tools">
      <a class="ib adm-link" id="admb" href="#admin">Administration</a>
      <button class="ib" id="th" aria-label="Changer de thème" title="Thème"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
      <button class="ib" id="cartb" aria-label="Ouvrir le panier"><span class="hide-m">Panier</span><span class="cnt" id="cnt">0</span></button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="wrap" id="foot"></footer>

pendant le transport, de défaut de fabrication constaté à la réception, ou d'erreur sur le produit livré.\n\nRemboursement\nIl n'est accordé que si la pièce ne peut être ni réparée ni remplacée, ou si Nervina annule la commande avant le début de la fabrication. Il est versé par le moyen de paiement d'origine.\n\nPièces sur mesure\nLes pièces faites sur mesure, personnalisées ou à vos dimensions ne sont ni reprises ni remboursées, sauf défaut de fabrication vérifié."}, "cgv": {"title": "Conditions générales de vente", "body": "Dernière mise à jour : juin 2026.\n\n1. Présentation\nNervina est une marque marocaine de décoration d'intérieur et de mobilier. Les présentes conditions régissent toutes les ventes réalisées sur cette boutique.\n\n2. Commandes\nPasser commande signifie accepter ces conditions. Nervina peut annuler une commande en cas de problème de disponibilité ou d'informations erronées.\n\n3. Prix\nLes prix sont indiqués en dirhams marocains (MAD). Nervina peut les modifier à tout moment, sans préavis.\n\n4. Paiement\nUn acompte de 30 % est dû à la confirmation de la commande, et le solde de 70 % à la livraison. L'acompte n'est remboursable qu'en cas de défaut avéré du produit ou d'annulation par Nervina.\n\n5. Livraison\nLes délais sont indicatifs. Nervina n'est pas responsable des retards causés par les transporteurs ou les douanes.\n\n6. Retours\nVous avez 14 jours après la réception pour signaler un problème, selon la politique de retour. Les articles personnalisés sont exclus du droit de retour.\n\n7. Responsabilité\nNervina n'est pas responsable des dommages indirects. Sa responsabilité est limitée à la valeur de la commande concernée.\n\n8. Propriété intellectuelle\nLes photos, textes et logos de la boutique appartiennent à Nervina et ne peuvent pas être reproduits sans autorisation préalable.\n\n9. Données personnelles\nLes informations recueillies lors des commandes servent uniquement à les traiter. Elles ne sont pas vendues à des tiers."}, "a-propos": {"title": "À propos de Nervina", "body": "Nervina est une marque marocaine de décoration d'intérieur, fondée en 2020 par un jeune entrepreneur passionné de design.\n\nNotre mission : transformer chaque espace en un lieu unique, chaleureux et inspirant.\n\nPour nous, la décoration est une façon d'exprimer son identité et de raconter une histoire à travers les objets, les textures et les couleurs. Chaque pièce associe un savoir-faire artisanal marocain et un design contemporain.\n\nNous expédions depuis le Maroc. Rejoignez la communauté Nervina : écrivez-nous sur WhatsApp."}, "livraison": {"title": "Politique d'expédition", "body": "Zone de livraison\nNous livrons dans toutes les villes du Maroc. Les zones éloignées peuvent entraîner des frais supplémentaires, annoncés avant la confirmation de la commande.\n\nDélais\nProduits standard : 3 à 7 jours ouvrables. Produits sur mesure : 7 à 21 jours ouvrables selon la complexité du projet. Ces délais sont des estimations : ils peuvent varier selon la charge de production, le transport ou d'autres facteurs hors de notre contrôle.\n\nFrais de livraison\nIls dépendent de la destination, des dimensions du produit et du mode de transport. Le montant exact vous est communiqué avant la finalisation de la commande.\n\nÀ la réception\nVérifiez le produit à la livraison. En cas de dommage visible, contactez-nous dans les 48 heures avec des photos du produit et de l'emballage.\n\nRetards\nNervina n'est pas responsable des retards dus aux transporteurs, à la météo, aux jours fériés ou à tout autre événement indépendant de sa volonté."}, "conditions": {"title": "Conditions d'utilisation", "body": "En visitant la boutique ou en passant commande, vous acceptez ces conditions.\n\nProduits\nNervina fabrique et vend du mobilier, de la décoration d'intérieur et des aménagements sur mesure. Les couleurs, textures et finitions peuvent varier légèrement selon les écrans et les matériaux. Les dimensions sont approximatives.\n\nCommandes\nUne s droits\nVous pouvez demander à accéder à vos informations, à les corriger ou à les supprimer en nous écrivant à l'adresse indiquée dans la page Coordonnées.\n\nMises à jour\nCette politique peut évoluer. La date de dernière mise à jour figure ci-dessous.\n\nDernière mise à jour : octobre 2026."}, "coordonnees": {"title": "Coordonnées", "body": "Nervina Maroc, Casablanca.\n\nE-mail : nervina.maroc@gmail.com\nTéléphone et WhatsApp : 06 54 29 09 60 · 06 56 57 20 30\n\nÉcrivez-nous pour une commande, une livraison ou une question sur un produit. Nous répondons au plus vite."}}, "shopify": {"images/table-basse-amazonica-1.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/LTO-523-D-G-WLNT-CHMPGLAmazonicocoffeetablewithlargetopinwalnutsmalltopinChampagneglass10_9200ea14-6859-4b9b-aac6-b50e79c9b8c9.webp?v=1781457008", "images/table-basse-amazonica-2.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/AmazonicomoderncoffeetablewithrotatingtopinChampagnecoloredglassandWalnutbaseandlargetop01.webp?v=1781457008", "images/table-basse-london-1.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/image_7b80a727-643c-4704-b4ff-c803230f9ec5.png?v=1781453320", "images/table-basse-london-2.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/aston_london_1.png?v=1781453129", "images/table-basse-london-3.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/image_cc37130d-75fe-4419-ae9e-fce01cab2df8.png?v=1781453321", "images/table-basse-london-4.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/mesa-de-centro-london-2-jpg_20230705081238_1.png?v=1781453128", "images/table-de-chevet-canne-1.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/commercial-photo-lifestyle.png?v=1781174336", "images/table-de-chevet-canne-2.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/terracotta.png?v=1781174484", "images/table-de-chevet-canne-3.webp": "https://cdn.shopify.com/s/files/1/0989/6647/1019/files/vert-s function ph(p,cls=''){const im=p.imgs&&p.imgs[0];
  return `<div class="ph ${cls}">${hasOld(p)?`<span class="badge">-${Math.round((1-p.price/p.old)*100)}%</span>`:''}${im?`<img src="${IMGURL(im)}" alt="${esc(p.title)}" loading="lazy">`:ico(p.col)}</div>`}
const priceH=p=>`<span class="price">${MAD(p.price)}${hasOld(p)?`<s>${MAD(p.old)}</s>`:''}</span>`;
function card(p){return `<article class="pc"><a class="im" href="#p-${esc(p.id)}" aria-label="${esc(p.title)}">${ph(p)}</a><h3><a href="#p-${esc(p.id)}">${esc(p.title)}</a></h3>${priceH(p)}<button class="btn ghost add" data-add="${esc(p.id)}">Ajouter au panier</button></article>`}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1900)}
function paras(body){return String(body||'').split(/\n\s*\n/).filter(x=>x.trim()).map(b=>{const l=b.split('\n');return l.length>1&&/\?\s*$/.test(l[0])?`<p class="q">${esc(l[0])}</p><p>${esc(l.slice(1).join(' '))}</p>`:`<p>${esc(b)}</p>`}).join('')}

/* ---------- vues boutique ---------- */
let filt='all',q='',sort='def';
function perks(){return `<ul>${(S.settings.perks||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
const VIEWS={
accueil(){
  const st=S.settings,f=prod(st.featured)||vis()[0],best=vis().filter(p=>p.star).slice(0,4),L=vis();
  const ar=S.collections.slice(0,3).map((c,i)=>`<div class="arch">${ico(c.id)}</div>`).join('');
  return `<section class="hero"><div><p class="eyebrow">Mobilier · Décoration · Menuiserie</p>
    <h1>${esc(st.heroTitle1)} <em>${esc(st.heroTitle2)}</em></h1>
    <p class="lead">${esc(st.heroLead)}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="#catalogue">Voir le catalogue</a><a class="btn ghost" href="#contact">Nous contacter</a></div></div>
    <div class="heroimg" aria-hidden="true">${f&&f.imgs&&f.imgs[0]?`<img src="${IMGURL(f.imgs[0])}" alt="">`:`<div class="arches">${ar}</div>`}</div></section>
  ${S.collections.length?`<section class="sec"><div class="sechead"><div><p class="eyebrow">Collections</p><h2>Magasiner par collection</h2></div></div>
    <div class="cols">${S.collections.map(c=>{const n=L.filter(p=>p.col===c.id).length;const cp=L.find(p=>p.col===c.id&&p.imgs&&p.imgs[0]);return `<a class="col" href="#c-${esc(c.id)}"><div class="arch" style="position:relative">${cp?`<img src="${IMGURL(cp.imgs[0])}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="lazy">`:ico(c.id)}</div><span>${esc(c.name)}<small>${n} pièce${n>1?'s':''}</small></span></a>`}).join('')}</div></section>`:''}
  ${L.length?'':`<section class="sec"><p class="empty">Les premières pièces arrivent bientôt. Écrivez-nous sur WhatsApp pour un projet sur mesure.</p></section>`}
  ${f?`<section class="sec"><div class="feat"><div>${ph(f,'sq')}</div><div><p class="eyebrow">Notre coup de cœur</p><h2>${esc(f.title)}</h2>${perks()}<p class="price" style="font-size:1.4rem;margin:0 0 22px">${MAD(f.price)}</p><a class="btn" href="#p-${esc(f.id)}">Découvrir</a></div></div></section>`:''}
  ${best.length?`<section class="sec"><div class="sechead"><div><p class="eyebrow">Sélection</p><h2>Pièces les plus demandées</h2></div><a href="#catalogue" style="font-size:.9rem">Tout voir</a></div><div class="grid">${best.map(card).join('')}</div></section>`:''}
  <section class="sec"><div class="trust">${(st.trust||[]).map(x=>`<div><b>${esc(x.t)}</b><p>${esc(x.d)}</p></div>`).join('')}</div></section>`},
catalogue(){
  let list=vis().filter(p=>(filt==='all'||p.col===filt)&&p.title.toLowerCase().includes(q.toLowerCase()));
  if(sort==='asc')list=[...list].sort((a,b)=>a.price-b.price);if(sort==='desc')list=[...list].sort((a,b)=>b.price-a.price);
  return `<section style="padding-block:44px 80px"><p class="eyebrow">Catalogue</p><h1 style="margin-bottom:28px">${filt==='all'?'Tous les produits':esc(colName(filt))}</h1>
  <div class="bar2"><div class="chips" role="group" aria-label="Collections">${[{id:'all',name:'Tout'},...S.collections].map(c=>`<button class="chip" data-f="${esc(c.id)}" aria-pressed="${filt===c.id}">${esc(c.name)}</button>`).join('')}</div>
  <div class="sf"><input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher" value="${esc(q)}"><select id="so" aria-label="Trier"><option value="def">Trier</option><option value="asc"${sort==='asc'?' selected':''}>Prix croissant</option><option value="desc"${sort==='desc'?' selected':''}>Prix décroissant</option></select></div></div>
  <div class="grid">${list.map(card).join('')||`<p class="empty">${vis().length?'Aucun produit ne correspond.':'Le catalogue sera bientôt rempli. Écrivez-nous sur WhatsApp pour un projet sur mesure.'}</p>`}</div></section>`},
produit(id){
  const p=prod(id);if(!p||p.hidden)return VIEWS.catalogue();
  const ims=p.imgs||[];
  return `<div class="crumb"><a href="#accueil">Accueil</a> / <a href="#catalogue">Catalogue</a> / ${esc(colName(p.col))}</div>
  <section class="pd"><div><div class="ph" id="main">${hasOld(p)?`<span class="badge">-${Math.round((1-p.price/p.old)*100)}%</span>`:''}${ims[0]?`<img id="mi" src="${IMGURL(ims[0])}" alt="${esc(p.title)}">`:ico(p.col)}</div>
    ${ims.length>1?`<div class="gal">${ims.map((m,i)=>`<button data-gi="${i}" aria-label="Photo ${i+1}" aria-current="${i===0}"><img src="${IMGURL(m)}" alt=""></button>`).join('')}</div>`:''}</div>
  <div><p class="eyebrow">${esc(colName(p.col))}</p><h1>${esc(p.title)}</h1>${priceH(p)}
  <p class="d">${esc(p.desc||S.settings.productDesc)}</p>${perks()}
  <div class="buy"><div class="qty"><button id="m" aria-label="Moins">−</button><span id="n">1</span><button id="pl" aria-label="Plus">+</button></div><button class="btn" id="ad" style="flex:1;min-width:180px">Ajouter au panier</button></div>
  <a class="btn ghost wide" href="${WAU('Bonjour, je suis intéressé par : '+p.title)}" target="_blank" rel="noopener">Poser une question sur WhatsApp</a>
  <p class="note" style="margin-top:14px">${esc(S.settings.productNote)}</p></div></section>
  <section class="sec"><div class="sechead"><h2>Dans la même collection</h2></div><div class="grid">${vis().filter(x=>x.col===p.col&&x.id!==p.id).slice(0,4).map(card).join('')}</div></section>`},
contact(){const st=S.settings,ig=String(st.instagram||'').replace(/^@/,'');
  return `<section class="info"><p class="eyebrow">Contact</p><h1>Parlons de votre projet.</h1><p>Le plus rapide : un message WhatsApp avec une photo et vos dimensions.</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin:22px 0"><a class="btn" href="${WAU('Bonjour, je suis intéressé par vos produits 😊')}" target="_blank" rel="noopener">Écrire sur WhatsApp</a>${ig?`<a class="btn ghost" href="https://www.instagram.com/${encodeURIComponent(ig)}/" target="_blank" rel="noopener">@${esc(ig)}</a>`:''}</div>
  <p>${esc(st.whatsapp)}${st.phone2?' · '+esc(st.phone2):''}</p>
  <form class="cform" onsubmit="return false"><label for="cn">Nom<input id="cn" autocomplete="name"></label><label for="ct">Téléphone<input id="ct" inputmode="tel" autocomplete="tel"></label><label for="cm">Message<textarea id="cm" rows="4" placeholder="Produit, dimensions, couleur…"></textarea></label>
  <a class="btn" id="cw" href="#" target="_blank" rel="noopener">Envoyer sur WhatsApp</a><span class="note">Le bouton ouvre WhatsApp avec votre message déjà écrit. Rien n'est envoyé avant que vous validiez.</span></form></section>`},
page(k){const pg=S.pages[k];if(!pg)return VIEWS.accueil();
  return `<section class="info"><p class="eyebrow">Informations</p><h1>${esc(pg.title)}</h1><div class="para">${paras(pg.body)||'<p>Cette page sera bientôt complétée.</p>'}</div></section>`}};

function route(){
  let h=(location.hash||'#accueil').slice(1),html;
  if(h==='admin'){if(canEdit){renderAdmin();setNav(h);return}h='accueil'}
  if(h.startsWith('c-')){filt=h.slice(2);h='catalogue'}
  if(h.startsWith('p-'))html=VIEWS.produit(h.slice(2));
  else if(h==='catalogue')html=VIEWS.catalogue();
  else if(S.pages[h])html=VIEWS.page(h);
  else html=(VIEWS[h]||VIEWS.accueil)();
  app.innerHTML=html;scrollTo(0,0);bind(h);setNav(h);
}
function setNav(h){document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.r===(h.startsWith('p-')?'catalogue':h)));
  $('#nav').classList.remove('open');$('#bg').setAttribute('aria-expanded','false')}
function bind(h){
  if(h==='catalogue'){
    app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;rerender()});
    $('#q').oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;rerender();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)};
    $('#so').onchange=e=>{sort=e.target.value;rerender()};
  }
  if(h.startsWith('p-')){
    let n=1;const id=h.slice(2);
    $('#m').onclick=()=>{n=Math.max(1,n-1);$('#n').textContent=n};$('#pl').onclick=()=>{n=Math.min(20,n+1);$('#n').textContent=n};
    $('#ad').onclick=()=>{add(id,n);openCart()};
    app.querySelectorAll('[data-gi]').forEach(b=>b.onclick=()=>{const p=prod(id);$('#mi').src=IMGURL(p.imgs[+b.dataset.gi]);app.querySelectorAll('[data-gi]').forEach(x=>x.setAttribute('aria-current',x===b))});
  }
  if(h==='contact'){
    const u=()=>{const t=`Bonjour Nervina, ${$('#cm').value.trim()||'je suis intéressé par vos produits.'}${$('#cn').value.trim()?'\nNom : '+$('#cn').value.trim():''}${$('#ct').value.trim()?'\nTéléphone : '+$('#ct').value.trim():''}`;$('#cw').href=WAU(t)};
    ['cn','ct','cm'].forEach(i=>$('#'+i).oninput=u);u();
  }
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add,1));
}
function rerender(){const k=scrollY;app.innerHTML=VIEWS.catalogue();bind('catalogue');scrollTo(0,k)}

/* ---------- panier ---------- */
function add(id,n){cart[id]=Math.min(20,(cart[id]||0)+n);saveCart();updCnt();toast('Ajouté au panier')}
function updCnt(){$('#cnt').textContent=Object.entries(cart).filter(([id])=>prod(id)).reduce((a,[,b])=>a+b,0)}
const total=()=>Object.entries(cart).reduce((s,[id,n])=>s+(prod(id)?.price||0)*n,0);
function openCart(){
  const items=Object.entries(cart).filter(([id])=>prod(id));
  layer.innerHTML=`<div class="veil" id="vl"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Panier"><div class="dh"><h2>Votre panier</h2><button class="ib" id="cx">Fermer</button></div>
  <div class="db">${items.length?items.map(([id,n])=>{const p=prod(id);return `<div class="li">${ph(p)}<div><b>${esc(p.title)}</b><span class="price" style="font-size:.88rem">${MAD(p.price)}</span><div class="qty"><button data-q="${esc(id)}" data-d="-1" aria-label="Moins">−</button><span>${n}</span><button data-q="${esc(id)}" data-d="1" aria-label="Plus">+</button></div></div><button class="rm" data-r="${esc(id)}">Retirer</button></div>`}).join(''):'<p class="empty">Votre panier est vide.</p>'}</div>
  ${items.length?`<div class="df"><div class="tot"><span>Total</span><span>${MAD(total())}</span></div><span class="note">Livraison confirmée par WhatsApp avant toute validation.</span>
  <input id="on" placeholder="Votre nom" autocomplete="name" aria-label="Nom"><div class="row2"><input id="ot" placeholder="Téléphone" inputmode="tel" autocomplete="tel" aria-label="Téléphone"><input id="ov" placeholder="Ville" autocomplete="address-level2" aria-label="Ville"></div><input id="oa" placeholder="Adresse de livraison" autocomplete="street-address" aria-label="Adresse">
  <a class="btn wide" id="ow" href="#" target="_blank" rel="noopener">Commander sur WhatsApp</a></div>`:`<div class="df"><a class="btn wide" href="#catalogue" id="cc">Voir le catalogue</a></div>`}</aside>`;
  const close=()=>{layer.innerHTML='';document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  $('#vl').onclick=close;$('#cx').onclick=close;$('#cx').focus();if($('#cc'))$('#cc').onclick=close;
  layer.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const id=b.dataset.q;cart[id]=(cart[id]||0)+ +b.dataset.d;if(cart[id]<=0)delete cart[id];if(cart[id]>20)cart[id]=20;saveCart();updCnt();openCart()});
  layer.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.r];saveCart();updCnt();openCart()});
  if($('#ow')){const u=()=>{const l=items.map(([id,n])=>`• ${n} × ${prod(id).title} (${MAD(prod(id).price)})`).join('\n');
    const t=`Bonjour Nervina, je souhaite commander :\n${l}\nTotal : ${MAD(total())}\n\nNom : ${$('#on').value.trim()}\nTéléphone : ${$('#ot').value.trim()}\nVille : ${$('#ov').value.trim()}\nAdresse : ${$('#oa').value.trim()}`;
    $('#ow').href=WAU(t)};['on','ot','ov','oa'].forEach(i=>$('#'+i).oninput=u);u()}
}

/* ---------- administration ---------- */
let tab='produits',editId=null,pageKey='faq',delAsk=null;
const slug=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'produit';
function markDirty(){dirty=true;stMsg='';paintSt()}
function paintSt(){const e=$('#ast');if(!e)return;e.className='st'+(dirty?' dirty':stMsg?' ok':'');e.textContent=saving?'Publication en cours…':dirty?'Modifications non publiées':stMsg;const b=$('#asave');if(b){b.disabled=!dirty||saving;b.style.opacity=b.disabled?.5:1}}

  ${S.products.map((p,i)=>`<div class="arow${p.hidden?' off':''}">${th(p)}<div><b>${esc(p.title)}</b><small>${MAD(p.price)} · ${esc(colName(p.col))}${p.hidden?' · masqué':''}${p.star?' · accueil':''}${p.imgs&&p.imgs.length?'':' · sans photo'}</small></div>

function aEdit(p){

  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${delAsk===p.id?`<span class="warn" style="padding:8px 14px">Supprimer définitivement ce produit ?</span><button class="sm danger" data-a="delyes">Oui, supprimer</button><button class="sm" data-a="delno">Annuler</button>`:`<button class="sm danger" data-a="del">Supprimer ce produit</button>`}</div></div>`;

function aCollections(){

function aBoutique(){
  const s=S.settings,F=(k,l,t='input',r=3)=>t==='input'?`<label>${l}<input data-s="${k}" value="${esc(s[k])}"></label>`:`<label>${l}<textarea data-s="${k}" rows="${r}">${esc(s[k])}</textarea></label>`;
  return `<div class="ed">${F('banner','Bandeau du haut')}
  <div class="f2">${F('heroTitle1','Titre d\'accueil, début')}${F('heroTitle2','Titre d\'accueil, fin (en couleur)')}</div>${F('heroLead','Texte d\'accueil','ta')}</div>
  <div class="ed"><div class="f2">${F('whatsapp','Numéro WhatsApp (reçoit les commandes)')}${F('phone2','Second numéro (affiché sur la page contact)')}</div>${F('instagram','Compte Instagram (sans @)')}
  <p class="hint">Format accepté : 06 54 29 09 60. Il est converti automatiquement pour WhatsApp.</p></div>
  <div class="ed"><b style="font-weight:500">Atouts affichés sur chaque produit</b>${[0,1,2].map(i=>`<label>Atout ${i+1}<input data-perk="${i}" value="${esc((s.perks||[])[i]||'')}"></label>`).join('')}
  ${F('productDesc','Description par défaut des produits','ta')}${F('productNote','Note sous le bouton d\'achat')}</div>
  <div class="ed"><b style="font-weight:500">Bandeau de réassurance (accueil)</b>${[0,1,2].map(i=>`<div class="f2"><label>Titre ${i+1}<input data-tt="${i}" value="${esc(((s.trust||[])[i]||{}).t||'')}"></label><label>Texte ${i+1}<input data-td="${i}" value="${esc(((s.trust||[])[i]||{}).d||'')}"></label></div>`).join('')}</div>
  <div class="ed"><label>Produit « coup de cœur » de l'accueil<select data-s="featured"><option value="">Automatique (premier produit)</option>${S.products.map(p=>`<option value="${esc(p.id)}"${p.id===s.featured?' selected':''}>${esc(p.title)}</option>`).join('')}</select></label>
  ${F('footerText','Texte du pied de page','ta',2)}${F('legal','Mentions en bas de page')}</div>`;
}
function aPages(){
  const k=pageKey,pg=S.pages[k];
  return `<div class="ed"><label>Page<select id="pk">${Object.entries(S.pages).map(([a,b])=>`<option value="${esc(a)}"${a===k?' selected':''}>${esc(b.title)}</option>`).join('')}</select></label>
  <label>Titre<input data-pt="1" value="${esc(pg.title)}"></label>
  <label>Texte<textarea data-pb="1" rows="12">${esc(pg.body)}</textarea></label>
  <p class="hint">Séparez les paragraphes par une ligne vide. Pour la FAQ : une ligne de question terminée par « ? », puis la réponse en dessous.</p></div>`;
}
function bindA(){
  const body=$('#abody');
  body.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,id=b.dataset.id;
    if(a==='edit'){editId=editId===id?null:id;delAsk=null;return refreshBody()}
    if(a==='new'){const nid=uniq('nouveau-produit');S.products.unshift({id:nid,title:'Nouveau produit',price:0,old:0,col:S.collections[0]?.id||'',desc:'',imgs:[],hidden:true,star:false});editId=nid;markDirty();return refreshBody()}
    if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1;[S.products[i],S.products[j]]=[S.products[j],S.products[i]];markDirty();return refreshBody()}
    if(a==='del'){delAsk=editId;return refreshBody()}
    if(a==='delno'){delAsk=null;return refreshBody()}
    if(a==='delyes'){S.products=S.products.filter(p=>p.id!==editId);if(S.settings.featured===editId)S.settings.featured=S.products[0]?.id||'';editId=null;delAsk=null;markDirty();return refreshBody()}
    const p=prod(editId);
    if(p&&(a==='imgl'||a==='imgr')){const j=a==='imgl'?i-1:i+1;[p.imgs[i],p.imgs[j]]=[p.imgs[j],p.imgs[i]];markDirty();return refreshBody()}
    if(p&&a==='imgx'){p.imgs.splice(i,1);markDirty();return refreshBody()}
    if(a==='colnew'){let n=uniq('collection',S.collections);S.collections.push({id:n,name:'Nouvelle collection'});markDirty();return refreshBody()}
    if(a==='colx'){S.collections.splice(i,1);markDirty();return refreshBody()}
  };
  body.oninput=e=>{const t=e.target;
    const w=t.closest('[data-pid]');
    if(w&&t.dataset.k){const p=prod(w.dataset.pid);const k=t.dataset.k;
      if(t.type==='checkbox')p[k]=t.checked;else if(t.dataset.n)p[k]=Math.max(0,parseInt(String(t.value).replace(/\D/g,''),10)||0);else p[k]=t.value;
      markDirty();return}
    if(t.dataset.ck!==undefined){S.collections[+t.dataset.ck].name=t.value;markDirty();return}
    if(t.dataset.s){S.settings[t.dataset.s]=t.value;markDirty();return}
    if(t.dataset.perk!==undefined){(S.settings.perks=S.settings.perks||[])[+t.dataset.perk]=t.value;markDirty();return}
    if(t.dataset.tt!==undefined){const a=(S.settings.trust=S.settings.trust||[]);(a[+t.dataset.tt]=a[+t.dataset.tt]||{t:'',d:''}).t=t.value;markDirty();return}
    if(t.dataset.td!==undefined){const a=(S.settings.trust=S.settings.trust||[]);(a[+t.dataset.td]=a[+t.dataset.td]||{t:'',d:''}).d=t.value;markDirty();return}
    if(t.dataset.pt){S.pages[pageKey].title=t.value;markDirty();return}
    if(t.dataset.pb){S.pages[pageKey].body=t.value;markDirty();return}
  };
  body.onchange=async e=>{const t=e.target;
    if(t.id==='pk'){pageKey=t.value;return refreshBody()}
    if(t.dataset.k==='col'||t.dataset.k==='hidden'||t.dataset.k==='star'){if(t.dataset.k!=='col')return;}
    if(t.id==='fi'&&t.files.length){await upload(t)}
    if(t.dataset.s==='featured'){}
  };
}
function refreshBody(){const y=scrollY;$('#abody').innerHTML=aBody();paintSt();scrollTo(0,y);bindA()}
function uniq(base,list=S.products){let id=slug(base),n=1;const has=x=>list.some(p=>p.id===x);while(has(id)){n++;id=slug(base)+'-'+n}return id}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
    const M=1600,r=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.86));
  }finally{URL.revokeObjectURL(url)}
}
async function upload(inp){
  const p=prod(editId),files=[...inp.files],u=$('#up');let ok=0;
  for(const f of files){
    if(u)u.textContent=`Envoi ${ok+1}/${files.length}…`;
    try{const blob=await shrink(f);const r=await assets.upload(blob,{type:'image/jpeg'});p.imgs=p.imgs||[];p.imgs.push(r.id);ok++;markDirty()}
    catch(e){if(u)u.textContent='Échec de l\'envoi'+(e&&e.code?' ('+e.code+')':'')+'.';break}
  }
  refreshBody();
}
async function publish(){
  if(saving||!dirty)return;saving=true;paintSt();
  const json=JSON.stringify(S);
  try{
    if(!artifact)throw {code:'capability_disabled'};
    await artifact.publish({'store.json':json});
    dirty=false;stMsg='Publié. Les visiteurs voient les changements.';
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict')stMsg='Une autre version a été publiée. Rechargez la page puis refaites vos changements.';
    else if(c==='not_writer'||c==='not_granted')stMsg='Vous n\'avez pas le droit de publier.';
    else if(c==='capability_disabled')stMsg='Publication directe indisponible ici.';
    else if(c==='rate_limited')stMsg='Trop de publications, attendez un instant.';
    else stMsg='La publication a échoué. Réessayez.';
    if(c==='capability_disabled'||c==='upstream_error')offerFile(json);
  }
  saving=false;paintSt();
}
async function offerFile(json){
  try{const d=await claude.use('downloads');if(!d)return;
    stMsg+=' Vos données vont être proposées en téléchargement.';paintSt();
    await d.save({filename:'store.json',data:json});
  }catch(e){}
}

/* ---------- init ---------- */
$('#cartb').onclick=openCart;
$('#bg').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
addEventListener('hashchange',route);
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
chrome();updCnt();route();
// données publiées (store.json), puis outils d'administration pour les éditeurs
(async()=>{
  try{const r=await fetch('store.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.products){S=j;chrome();updCnt();if(!dirty&&(location.hash||'#accueil')!=='#admin')route()}}}catch(e){}
  try{if(window.claude&&claude.use){
    const u=await claude.use('user');canEdit=u?await u.canEdit():false;
    if(canEdit){artifact=await claude.use('artifact');assets=await claude.use('assets');chrome();if(location.hash==='#admin')route()}
  }}catch(e){}
})();
</script>
